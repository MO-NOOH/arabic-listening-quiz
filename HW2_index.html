<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏠 Homework 2: ق • ت • ي Challenge</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;font-family:system-ui;background:linear-gradient(135deg,#fff6cf,#e6f6ff);color:#243447;min-height:100vh}
main{max-width:850px;margin:auto}h1,p{text-align:center}.sub{color:#607080}.stats{display:flex;justify-content:space-between;font-weight:800;gap:8px}.pill{background:white;padding:9px 14px;border-radius:999px}
.track{height:14px;background:white;border-radius:99px;overflow:hidden;margin:12px 0}#bar{height:100%;background:linear-gradient(90deg,#ffb703,#ff7900,#6c63ff);width:0;transition:.3s}
.card{background:white;border-radius:24px;padding:clamp(15px,4vw,30px);box-shadow:0 12px 30px #0002}.listen,.next,.restart{display:block;width:min(450px,100%);margin:15px auto;border:0;border-radius:18px;padding:16px;font-size:1.15rem;font-weight:900;cursor:pointer}
.listen{background:#6c63ff;color:white}.next,.restart{background:#ffb703}.next:disabled{opacity:.4}.opts{display:grid;grid-template-columns:repeat(1,1fr);gap:13px}
.opt{min-height:95px;border:3px solid #dce6ef;border-radius:18px;background:#fbfdff;font-family:"Traditional Arabic","Noto Naskh Arabic",serif;font-size:clamp(2.5rem,9vw,4rem);line-height:1.6;direction:rtl;font-weight:700;cursor:pointer}
.opt.good{border-color:#2eaf62;background:#e8f8ee}.opt.bad{border-color:#df3e4f;background:#ffe9ec}.opt:disabled{opacity:1}#fb{display:none;text-align:center;background:#f7fafc;border-radius:15px;padding:14px;margin-top:16px;font-weight:800}#fb.show{display:block}.ar{font-family:"Traditional Arabic",serif;font-size:2rem;direction:rtl}.tip{background:#fff6cf;padding:9px;border-radius:10px;margin-top:8px}#end{display:none;text-align:center}#end.show{display:block}.hide{display:none}#big{font-size:3rem;font-weight:1000;color:#6c63ff}
@media(max-width:600px){.opts{grid-template-columns:1fr}.opt{min-height:80px;font-size:3rem}}</style></head>
<body><main><h1>🏠 Homework 2: ق • ت • ي Challenge</h1><p class="sub">30 questions • 3 close choices • ق vs ت vs ي + Alif Madd</p><div class="stats"><span class="pill" id="qno"></span><span class="pill" id="score"></span></div><div class="track"><div id="bar"></div></div>
<div class="card"><section id="quiz"><p><b>🔊 Listen carefully, then choose exactly what you hear.</b></p><button id="listen" class="listen">🔊 Listen to the word</button><div id="opts" class="opts"></div>
<div id="fb"><div id="result"></div><div>Your answer: <span class="ar" id="your"></span></div><div>Correct answer: <span class="ar" id="correct"></span></div><div class="tip" id="tip"></div></div><button id="next" class="next" disabled>Next question ➜</button></section>
<section id="end"><div style="font-size:3rem">🏆</div><h2>Homework complete!</h2><div id="big"></div><div id="percent"></div><div class="ar" id="praise"></div><button class="restart" id="restart">🔄 Restart / Try Again</button></section></div></main>
<script>
const BANK=[{"word": "قَا", "options": ["قَا", "تَا", "يَا"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "تَا", "options": ["تَا", "قَا", "يَا"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "يَا", "options": ["يَا", "تَا", "قَا"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "قَالَ", "options": ["قَالَ", "تَالَ", "يَالَ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "تَابَ", "options": ["تَابَ", "قَابَ", "يَابَ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "يَاسٌ", "options": ["يَاسٌ", "تَاسٌ", "قَاسٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "قَامَ", "options": ["قَامَ", "تَامَ", "يَامَ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "تَاجٌ", "options": ["تَاجٌ", "قَاجٌ", "يَاجٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "يَدٌ", "options": ["يَدٌ", "تَدٌ", "قَدٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "قَدٌ", "options": ["قَدٌ", "تَدٌ", "يَدٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "تَمٌ", "options": ["تَمٌ", "قَمٌ", "يَمٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "يَمٌ", "options": ["يَمٌ", "تَمٌ", "قَمٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "قَلَمٌ", "options": ["قَلَمٌ", "تَلَمٌ", "يَلَمٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "تَمَرٌ", "options": ["تَمَرٌ", "قَمَرٌ", "يَمَرٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "يَمَنٌ", "options": ["يَمَنٌ", "تَمَنٌ", "قَمَنٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "قِيلَ", "options": ["قِيلَ", "تِيلَ", "يِيلَ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "تِينٌ", "options": ["تِينٌ", "قِينٌ", "يِينٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "يَمِينٌ", "options": ["يَمِينٌ", "تَمِينٌ", "قَمِينٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "قُوتٌ", "options": ["قُوتٌ", "تُوتٌ", "يُوتٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "تُوتٌ", "options": ["تُوتٌ", "قُوتٌ", "يُوتٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "يُومٌ", "options": ["يُومٌ", "تُومٌ", "قُومٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "بَقَا", "options": ["بَقَا", "بَتَا", "بَيَا"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "فَتَى", "options": ["فَتَى", "فَقَى", "فَيَى"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "بَيَانٌ", "options": ["بَيَانٌ", "بَتَانٌ", "بَقَانٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "نَقَابٌ", "options": ["نَقَابٌ", "نَتَابٌ", "نَيَابٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "كِتَابٌ", "options": ["كِتَابٌ", "كِقَابٌ", "كِيَابٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "حَيَاةٌ", "options": ["حَيَاةٌ", "حَتَاةٌ", "حَقَاةٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "مَقَامٌ", "options": ["مَقَامٌ", "مَتَامٌ", "مَيَامٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "مَتَاعٌ", "options": ["مَتَاعٌ", "مَقَاعٌ", "مَيَاعٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}, {"word": "بَيَاتٌ", "options": ["بَيَاتٌ", "بَتَاتٌ", "بَقَاتٌ"], "tip": "Listen carefully for ق /q/, ت /t/, or ي /y/. Also notice whether the Fatḥah is lengthened by Alif Madd (ā)."}];let qs=[],i=0,points=0,answered=false,voice=null;const $=x=>document.getElementById(x);
function shuffle(a){a=[...a];for(let x=a.length-1;x>0;x--){let y=Math.floor(Math.random()*(x+1));[a[x],a[y]]=[a[y],a[x]]}return a}
function setVoice(){let vs=speechSynthesis.getVoices().filter(v=>(v.lang||"").toLowerCase().startsWith("ar"));voice=vs[0]||null}if("speechSynthesis"in window){setVoice();speechSynthesis.onvoiceschanged=setVoice}
function speak(){if(!("speechSynthesis"in window))return alert("Please use a modern browser with speech support.");speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(qs[i].word);u.lang=voice?.lang||"ar-SA";if(voice)u.voice=voice;u.rate=.7;speechSynthesis.speak(u)}
function start(){qs=shuffle(BANK).map(q=>({...q,answers:shuffle(q.options)}));i=0;points=0;$("quiz").classList.remove("hide");$("end").classList.remove("show");render()}
function render(){answered=false;$("fb").classList.remove("show");$("next").disabled=true;$("opts").innerHTML="";$("qno").textContent=`Question ${i+1}/30`;$("score").textContent=`Score: ${points}`;$("bar").style.width=`${i/30*100}%`;qs[i].answers.forEach(t=>{let b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(t,b);$("opts").appendChild(b)})}
function pick(t,b){if(answered)return;answered=true;let q=qs[i],ok=t===q.word;if(ok)points++;[...$("opts").children].forEach(x=>{x.disabled=true;if(x.textContent===q.word)x.classList.add("good")});if(!ok)b.classList.add("bad");$("result").textContent=ok?"✅ Correct!":"❌ Not quite — listen again.";$("your").textContent=t;$("correct").textContent=q.word;$("tip").textContent=q.tip;$("fb").classList.add("show");$("score").textContent=`Score: ${points}`;$("bar").style.width=`${(i+1)/30*100}%`;$("next").disabled=false;$("next").textContent=i===29?"See my result 🏆":"Next question ➜"}
$("listen").onclick=speak;$("next").onclick=()=>{if(!answered)return;if(i<29){i++;render();scrollTo(0,0)}else finish()};function finish(){$("quiz").classList.add("hide");$("end").classList.add("show");let p=Math.round(points/30*100);$("big").textContent=`${points} / 30`;$("percent").textContent=`${p}%`;$("bar").style.width="100%";$("praise").textContent=points>=27?"مُمْتَاز! ⭐⭐⭐":points>=23?"جَيِّدٌ جِدًّا! ⭐⭐":points>=18?"جَيِّدٌ! ⭐":"حَاوِلْ مَرَّةً أُخْرَى!"}$("restart").onclick=start;start();
</script></body></html>
