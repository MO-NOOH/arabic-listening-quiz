<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار الألف المدية المتقدم</title>
<style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#f4f7fb;font-family:Tahoma,Arial,sans-serif;color:#223}.app{max-width:720px;margin:auto;background:#fff;border-radius:22px;padding:28px;box-shadow:0 8px 28px #0001}h1{text-align:center;color:#173b63}.intro{text-align:center;color:#667085;line-height:1.8}.meta{display:flex;justify-content:space-between;margin:20px 0}.bar{height:10px;background:#e8edf3;border-radius:20px;overflow:hidden}#fill{height:100%;background:#173b63;width:0}.listen{width:100%;padding:16px;border:0;border-radius:14px;background:#173b63;color:white;font-size:20px;cursor:pointer;margin:24px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{padding:18px;border:2px solid #dde4ec;background:#fff;border-radius:14px;font-size:27px;cursor:pointer}.correct{border-color:#198754!important;background:#e9f7ef!important}.wrong{border-color:#c0392b!important;background:#fdecea!important}#feedback{text-align:center;min-height:58px;padding:14px;font-size:18px;font-weight:bold}#next{display:none;margin:auto;padding:12px 28px;border:0;border-radius:12px;background:#173b63;color:white;font-size:17px;cursor:pointer}.end{text-align:center;padding:25px}@media(max-width:520px){.options{grid-template-columns:1fr}}</style></head>
<body><main class="app"><h1>🔊 اختبار الأَلِف المَدِّيَّة — متقدم</h1><p class="intro">استمع إلى الكلمة كاملة، ثم اخترها من بين كلمات وكتابات متشابهة جدًا.</p><div class="meta"><span id="progress"></span><span id="score"></span></div><div class="bar"><div id="fill"></div></div><section id="quiz"><button class="listen" id="listen">🔊 استمع إلى الكلمة</button><div class="options" id="options"></div><div id="feedback"></div><button id="next">السؤال التالي ←</button></section></main>
<script>const questions=[{"word": "حَافِلَة", "options": ["حَافِلَة", "حَفْلَة", "حَفِلَة", "حَافْلَة"]}, {"word": "طَاوِلَة", "options": ["طَاوِلَة", "طَوِيلَة", "طَوْلَة", "طَوِلَة"]}, {"word": "نَافِذَة", "options": ["نَافِذَة", "نَفَذَة", "نَفْذَة", "نَافْذَة"]}, {"word": "مَسَافَة", "options": ["مَسَافَة", "مَسْأَلَة", "مَسَفَة", "مَسْفَة"]}, {"word": "شَارِع", "options": ["شَارِع", "شَرِيع", "شَرَع", "شَارْع"]}, {"word": "حَارِس", "options": ["حَارِس", "حَرِيس", "حَرَس", "حَارْس"]}, {"word": "طَالِب", "options": ["طَالِب", "طَلَب", "طَلِيب", "طَالْب"]}, {"word": "كَاتِب", "options": ["كَاتِب", "كَتَب", "كَتِيب", "كَاتْب"]}, {"word": "جَالِس", "options": ["جَالِس", "جَلَس", "جَلِيس", "جَالْس"]}, {"word": "عَالِم", "options": ["عَالِم", "عَلِم", "عَلَم", "عَالَم"]}, {"word": "مَاهِر", "options": ["مَاهِر", "مَهْر", "مَهِر", "مَاهْر"]}, {"word": "سَابِق", "options": ["سَابِق", "سَبَق", "سَبِيق", "سَابْق"]}, {"word": "فَاتِح", "options": ["فَاتِح", "فَتَح", "فَتِيح", "فَاتْح"]}, {"word": "شَاهَدَ", "options": ["شَاهَدَ", "شَهِدَ", "شَهَدَ", "شَاهْدَ"]}, {"word": "سَافَرَ", "options": ["سَافَرَ", "سَفَرَ", "سَفْرَ", "سَافْرَ"]}, {"word": "قَالَ", "options": ["قَالَ", "قَلَّ", "قُلْ", "قِلْ"]}, {"word": "كَانَ", "options": ["كَانَ", "كُنْ", "كِنْ", "كَنَّ"]}, {"word": "نَامَ", "options": ["نَامَ", "نَمْ", "نِمْ", "نُم"]}, {"word": "صَامَ", "options": ["صَامَ", "صُمْ", "صَمَّ", "صِم"]}, {"word": "زَارَ", "options": ["زَارَ", "زُرْ", "زَرْ", "زِرْ"]}, {"word": "سَارَ", "options": ["سَارَ", "سِرْ", "سَرْ", "سُرْ"]}, {"word": "عَادَ", "options": ["عَادَ", "عُدْ", "عَدَّ", "عِدْ"]}, {"word": "فَازَ", "options": ["فَازَ", "فُزْ", "فَزَّ", "فِزْ"]}, {"word": "طَارَ", "options": ["طَارَ", "طِرْ", "طَرْ", "طُرْ"]}, {"word": "خَافَ", "options": ["خَافَ", "خِفْ", "خَفَّ", "خُفْ"]}, {"word": "بَاب", "options": ["بَاب", "بَبّ", "بِيب", "بُوب"]}, {"word": "تَاج", "options": ["تَاج", "تَجّ", "تِيج", "تُوج"]}, {"word": "نَار", "options": ["نَار", "نَرّ", "نِير", "نُور"]}, {"word": "مَال", "options": ["مَال", "مَلّ", "مِيل", "مُول"]}, {"word": "دَار", "options": ["دَار", "دَرّ", "دِير", "دُور"]}];let i=0,score=0,answered=false;const O=document.getElementById("options"),F=document.getElementById("feedback"),N=document.getElementById("next");function sh(a){return [...a].sort(()=>Math.random()-.5)}function speak(){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(questions[i].word);u.lang="ar-SA";u.rate=.68;speechSynthesis.speak(u)}function render(){answered=false;F.textContent="";N.style.display="none";O.innerHTML="";document.getElementById("progress").textContent=`السؤال ${i+1} من 30`;document.getElementById("score").textContent=`النتيجة: ${score}`;document.getElementById("fill").style.width=`${i/30*100}%`;sh(questions[i].options).forEach(x=>{const b=document.createElement("button");b.className="opt";b.textContent=x;b.onclick=()=>choose(b,x);O.appendChild(b)})}function choose(b,x){if(answered)return;answered=true;const c=questions[i].word;[...O.children].forEach(z=>{z.disabled=true;if(z.textContent===c)z.classList.add("correct")});if(x===c){score++;F.textContent="✅ أحسنت! إجابة صحيحة."}else{b.classList.add("wrong");F.textContent=`❌ الإجابة الصحيحة: ${c}`}document.getElementById("score").textContent=`النتيجة: ${score}`;N.style.display="block"}N.onclick=()=>{i++;i<30?render():finish()};document.getElementById("listen").onclick=speak;function finish(){document.getElementById("fill").style.width="100%";const p=Math.round(score/30*100);document.getElementById("quiz").innerHTML=`<div class="end"><h2>انتهى الاختبار 🎉</h2><h1>${score} / 30</h1><p>النسبة: ${p}%</p><button class="listen" onclick="location.reload()">إعادة الاختبار</button></div>`}render();</script></body></html>
