<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار الشدة</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f4f6fb;font-family:Arial,Tahoma,sans-serif;color:#172033;min-height:100vh}
.wrap{max-width:720px;margin:auto;padding:18px;height:100vh;display:flex;align-items:center;justify-content:center}
.panel{background:#fff;border-radius:22px;padding:28px;width:100%;box-shadow:0 6px 25px #0001;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:#667085}
.progress{height:8px;background:#e8ebf2;border-radius:8px;margin-bottom:25px;overflow:hidden} .bar{height:100%;background:#4f46e5;width:3.33%;transition:.3s}
h1{margin:0 0 6px;font-size:28px} .question{font-size:19px;font-weight:bold;margin:20px 0 18px}
.audio{border:0;border-radius:13px;background:#111827;color:#fff;padding:14px 24px;font-size:18px;cursor:pointer;margin-bottom:24px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{border:2px solid #d9dee8;background:#fafbfc;border-radius:14px;padding:17px 10px;font-size:27px;cursor:pointer;min-height:68px}
.option:hover{border-color:#4f46e5;background:#f0efff}
.option:disabled{cursor:default}
.option.correct{border-color:#16a34a;background:#dcfce7}
.option.wrong{border-color:#dc2626;background:#fee2e2}
.feedback{display:none;margin-top:18px;padding:15px;border-radius:12px;font-size:17px;line-height:1.7}
.feedback.correct{display:block;background:#dcfce7;color:#166534}
.feedback.wrong{display:block;background:#fee2e2;color:#991b1b}
.next{display:none;border:0;border-radius:13px;background:#4f46e5;color:#fff;padding:14px 35px;font-size:18px;cursor:pointer;margin-top:18px}
.result{display:none} .score{font-size:48px;font-weight:bold;color:#4f46e5;margin:18px}
.restart{border:0;border-radius:13px;background:#4f46e5;color:white;padding:14px 30px;font-size:18px;cursor:pointer}
@media(max-width:600px){.wrap{padding:10px}.panel{padding:20px 15px}.options{grid-template-columns:1fr}.option{font-size:25px}}
</style></head>
<body>
<div class="wrap"><div class="panel">
<div id="quiz">
<div class="top"><span id="counter">السؤال 1 من 30</span><span id="scoreTop">النتيجة: 0</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<h1>اختبار الشدّة</h1>
<div class="question">استمع إلى الكلمة، ثم اختر الكتابة الصحيحة:</div>
<button class="audio" onclick="speak()">🔊 اضغط للاستماع</button>
<div class="options" id="options"></div>
<div class="feedback" id="feedback"></div>
<button class="next" id="next" onclick="nextQuestion()">السؤال التالي ←</button>
</div>
<div class="result" id="result">
<h1>انتهى الاختبار!</h1><div class="score" id="finalScore"></div>
<div id="finalMessage"></div><br>
<button class="restart" onclick="location.reload()">إعادة الاختبار</button>
</div>
</div></div>
<script>
const qs=[{"word": "مُدَرِّس", "options": ["مُدَرِّس", "مُدَرِس", "مُدَرَّس", "مَدَرِّس"], "answer": 0, "feedback": "الشدة تكون على الراء: مُدَرِّس."}, {"word": "قِطَّة", "options": ["قِطَّة", "قِطَة", "قَطَّة", "قِطَط"], "answer": 0, "feedback": "الشدة تكون على الطاء: قِطَّة."}, {"word": "سَيَّارَة", "options": ["سَيَّارَة", "سَيَارَة", "سَيَّارَت", "سَيَّارَات"], "answer": 0, "feedback": "الشدة على الياء: سَيَّارَة."}, {"word": "مُعَلِّم", "options": ["مُعَلِّم", "مُعَلِم", "مُعَلَّم", "مَعَلِّم"], "answer": 0, "feedback": "الشدة على اللام: مُعَلِّم."}, {"word": "كَثِير", "options": ["كَثِير", "كَثِيرّ", "كَثِر", "كَثِيرَ"], "answer": 0, "feedback": "الكلمة الصحيحة كَثِير، ولا توجد شدة."}, {"word": "صَبَّاح", "options": ["صَبَّاح", "صَبَاح", "صَبَّح", "صَبَاحَ"], "answer": 0, "feedback": "الشدة على الباء: صَبَّاح."}, {"word": "مُحَمَّد", "options": ["مُحَمَّد", "مُحَمَد", "مُحَمِّد", "مَحَمَّد"], "answer": 0, "feedback": "الشدة على الميم الثانية: مُحَمَّد."}, {"word": "جَدَّة", "options": ["جَدَّة", "جَدَة", "جَدَّت", "جَدِّة"], "answer": 0, "feedback": "الشدة على الدال: جَدَّة."}, {"word": "مَرَّة", "options": ["مَرَّة", "مَرَة", "مُرَّة", "مَرَّ"], "answer": 0, "feedback": "الشدة على الراء: مَرَّة."}, {"word": "أُمِّي", "options": ["أُمِّي", "أُمِي", "أَمِّي", "أُمَّي"], "answer": 0, "feedback": "الشدة على الميم: أُمِّي."}, {"word": "أَحَبُّ", "options": ["أَحَبُّ", "أَحَبُ", "أَحَبَّ", "أَحِبُّ"], "answer": 0, "feedback": "الشدة على الباء: أَحَبُّ."}, {"word": "حَقّ", "options": ["حَقّ", "حَق", "حَقَّ", "حِقّ"], "answer": 0, "feedback": "الشدة على القاف: حَقّ."}, {"word": "شَدِيد", "options": ["شَدِيد", "شَدِّيد", "شَدِيدّ", "شَدَد"], "answer": 0, "feedback": "الكلمة الصحيحة شَدِيد، ولا توجد شدة."}, {"word": "دَرَّاجَة", "options": ["دَرَّاجَة", "دَرَاجَة", "دَرِّاجَة", "دَرَّاجَه"], "answer": 0, "feedback": "الشدة على الراء: دَرَّاجَة."}, {"word": "ثُمَّ", "options": ["ثُمَّ", "ثُمَ", "ثَمَّ", "ثُمِّ"], "answer": 0, "feedback": "الشدة على الميم: ثُمَّ."}, {"word": "إِنَّ", "options": ["إِنَّ", "إِنَ", "أَنَّ", "إِنِّ"], "answer": 0, "feedback": "الشدة على النون: إِنَّ."}, {"word": "لَكِنَّ", "options": ["لَكِنَّ", "لَكِنَ", "لَكَنَّ", "لَكِنِّ"], "answer": 0, "feedback": "الشدة على النون: لَكِنَّ."}, {"word": "رَبِّي", "options": ["رَبِّي", "رَبِي", "رَبَّي", "رَبِّ"], "answer": 0, "feedback": "الشدة على الباء: رَبِّي."}, {"word": "حُبُّ", "options": ["حُبُّ", "حُبُ", "حَبُّ", "حُبَّ"], "answer": 0, "feedback": "الشدة على الباء: حُبُّ."}, {"word": "قَوِيّ", "options": ["قَوِيّ", "قَوِي", "قَوِّي", "قَوَيّ"], "answer": 0, "feedback": "الشدة على الياء: قَوِيّ."}, {"word": "مُرَتَّب", "options": ["مُرَتَّب", "مُرَتَب", "مُرَتِّب", "مَرَتَّب"], "answer": 0, "feedback": "الشدة على التاء: مُرَتَّب."}, {"word": "مُرَبِّي", "options": ["مُرَبِّي", "مُرَبِي", "مُرَبَّي", "مَرَبِّي"], "answer": 0, "feedback": "الشدة على الباء: مُرَبِّي."}, {"word": "سَمَّاك", "options": ["سَمَّاك", "سَمَاك", "سَمَّكَ", "سَمِّاك"], "answer": 0, "feedback": "الشدة على الميم: سَمَّاك."}, {"word": "كَسَّرَ", "options": ["كَسَّرَ", "كَسَرَ", "كَسِّرَ", "كَسَّارَ"], "answer": 0, "feedback": "الشدة على السين: كَسَّرَ."}, {"word": "فَتَّحَ", "options": ["فَتَّحَ", "فَتَحَ", "فَتِّحَ", "فَتَّاحَ"], "answer": 0, "feedback": "الشدة على التاء: فَتَّحَ."}, {"word": "عَلَّمَ", "options": ["عَلَّمَ", "عَلَمَ", "عَلِّمَ", "عَلَّامَ"], "answer": 0, "feedback": "الشدة على اللام: عَلَّمَ."}, {"word": "دَرَّسَ", "options": ["دَرَّسَ", "دَرَسَ", "دَرِّسَ", "دَرَّاسَ"], "answer": 0, "feedback": "الشدة على الراء: دَرَّسَ."}, {"word": "قَبَّلَ", "options": ["قَبَّلَ", "قَبَلَ", "قَبِّلَ", "قَبَّالَ"], "answer": 0, "feedback": "الشدة على الباء: قَبَّلَ."}, {"word": "سَلَّمَ", "options": ["سَلَّمَ", "سَلَمَ", "سَلِّمَ", "سَلَّامَ"], "answer": 0, "feedback": "الشدة على اللام: سَلَّمَ."}, {"word": "حَبَّ", "options": ["حَبَّ", "حَبَ", "حَبِّ", "حَبَّب"], "answer": 0, "feedback": "الشدة على الباء: حَبَّ."}];
let current=0,score=0,answered=false;
function speak(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(qs[current].word);u.lang='ar-SA';u.rate=.78;speechSynthesis.speak(u);}
function render(){
 answered=false; const q=qs[current];
 document.getElementById('counter').textContent=`السؤال ${current+1} من 30`;
 document.getElementById('scoreTop').textContent=`النتيجة: ${score}`;
 document.getElementById('bar').style.width=((current+1)/30*100)+'%';
 document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='';
 document.getElementById('next').style.display='none';
 document.getElementById('options').innerHTML=q.options.map((o,i)=>`<button class="option" onclick="choose(${i},this)">${o}</button>`).join('');
}
function choose(i,el){
 if(answered)return; answered=true;
 const q=qs[current], buttons=document.querySelectorAll('.option');
 buttons.forEach(b=>b.disabled=true);
 if(i===q.answer){
   score++;el.classList.add('correct');
   showFeedback(true,'أحسنت! إجابة صحيحة.');
 }else{
   el.classList.add('wrong');buttons[q.answer].classList.add('correct');
   showFeedback(false,`الإجابة الصحيحة هي: ${q.options[q.answer]} — ${q.feedback}`);
 }
 document.getElementById('scoreTop').textContent=`النتيجة: ${score}`;
 document.getElementById('next').style.display='inline-block';
 document.getElementById('next').textContent=current===29?'عرض النتيجة':'السؤال التالي ←';
}
function showFeedback(ok,msg){let f=document.getElementById('feedback');f.className='feedback '+(ok?'correct':'wrong');f.textContent=msg;}
function nextQuestion(){
 if(current<29){current++;render();}else{
   document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';
   let p=Math.round(score/30*100);document.getElementById('finalScore').textContent=`${score} / 30 (${p}%)`;
   document.getElementById('finalMessage').textContent=p>=90?'ممتاز! أحسنت في الشدّة.':p>=75?'أحسنت! استمر في التدريب.':p>=60?'جيد، راجع مواضع الشدّة وحاول مرة أخرى.':'واصل التدريب على الشدّة، وستتحسن بإذن الله.';
 }
}
render();
</script></body></html>
